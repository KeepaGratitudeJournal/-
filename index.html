<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的感恩手帳 📖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- 引入 CryptoJS AES 輕量級加密庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

  <style>
    :root {
      --bg-color: #FAF6EE;
      --card-bg: #FFFFFF;
      --primary-color: #D97736;
      --accent-color: #E28743;
      --text-main: #3D3A37;
      --text-sub: #7A746E;
      --quote-bg: #FFF8E7;
      --border-color: #EBDDCB;
      --selected-bg: #FFEAD2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      line-height: 1.6;
    }
    .container { max-width: 540px; margin: 0 auto; }

    /* 頂部手帳抬頭 */
    .header {
      text-align: center;
      padding: 18px 14px;
      background: #FFFFFF;
      border-radius: 18px;
      border: 2px dashed var(--border-color);
      margin-bottom: 16px;
    }
    .header h1 { font-size: 22px; color: var(--primary-color); }
    .header p { font-size: 14px; color: var(--text-sub); margin-top: 2px; }

    /* 寫日記卡片 */
    .write-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 20px 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.12);
      margin-bottom: 24px;
    }

    /* 日期顯示條 */
    .today-date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px dashed #F2E5D5;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    /* 步驟進度標籤 */
    .step-indicator {
      font-size: 13px;
      background: var(--quote-bg);
      color: var(--primary-color);
      padding: 3px 8px;
      border-radius: 10px;
    }

    /* 天氣與心情選擇區 */
    .picker-section {
      margin-bottom: 14px;
    }
    .picker-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .icon-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .select-pill {
      flex: 1;
      min-width: 60px;
      padding: 8px 4px;
      background: #FAF6EE;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .select-pill.active {
      background: var(--selected-bg);
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: scale(1.03);
    }

    /* 自填心情框 */
    .custom-mood-input {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1.5px dashed var(--border-color);
      border-radius: 10px;
      outline: none;
      background-color: #FCFBF7;
      font-family: inherit;
    }
    .custom-mood-input:focus {
      border-color: var(--primary-color);
      background-color: #FFFFFF;
    }

    /* 三點條列輸入 */
    .three-things-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 10px;
    }
    .item-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FCFBF7;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .input-row:focus-within {
      border-color: var(--primary-color);
      background: #FFFFFF;
    }
    .row-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      min-width: 20px;
    }
    .input-row input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
    }

    /* 按鈕樣式 */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .action-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(217, 119, 54, 0.25);
    }
    .secondary-btn {
      width: 35%;
      background: #EFE7DB;
      color: var(--text-main);
      box-shadow: none;
    }
    .action-btn:disabled { background: #CCC; cursor: not-allowed; box-shadow: none; }

    /* 歷史日記列表 */
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      margin: 16px 0 12px;
      display: flex;
      justify-content: space-between;
    }
    .journal-list { display: flex; flex-direction: column; gap: 16px; }
    .journal-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.1);
      border: 1px solid var(--border-color);
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--primary-color);
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #F4EDE2;
    }
    .card-items {
      font-size: 16px;
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .card-items li {
      margin-bottom: 4px;
      list-style-type: none;
    }
    .empty-state { text-align: center; padding: 30px; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>🌸 我的感恩日記本</h1>
      <p>🔒 私密加密保護 ｜ 記錄專屬您的溫暖小確幸</p>
    </header>

    <!-- ✍️ 寫日記區塊 -->
    <section class="write-card">
      <div class="today-date-bar">
        <span id="displayDate">📅 載入今天日期...</span>
        <span class="step-indicator" id="stepIndicator">第 1 / 2 步</span>
      </div>

      <!-- 第一頁：天氣與心情 -->
      <div id="page1">
        <!-- 天氣選擇 -->
        <div class="picker-section">
          <div class="picker-label">☀️ 今天的天氣：</div>
          <div class="icon-group" id="weatherGroup">
            <div class="select-pill active" onclick="selectWeather('☀️ 晴天')">☀️ 晴天</div>
            <div class="select-pill" onclick="selectWeather('⛅ 多雲')">⛅ 多雲</div>
            <div class="select-pill" onclick="selectWeather('🌧️ 雨天')">🌧️ 雨天</div>
            <div class="select-pill" onclick="selectWeather('🍃 微風')">🍃 微風</div>
          </div>
        </div>

        <!-- 心情選擇 -->
        <div class="picker-section">
          <div class="picker-label">💖 今天的心情：</div>
          <div class="icon-group" id="moodGroup">
            <div class="select-pill active" onclick="selectPresetMood('😊 開心')">😊 開心</div>
            <div class="select-pill" onclick="selectPresetMood('🥰 幸福')">🥰 幸福</div>
            <div class="select-pill" onclick="selectPresetMood('😌 平靜')">😌 平靜</div>
            <div class="select-pill" onclick="selectPresetMood('💪 充實')">💪 充實</div>
          </div>
          <input type="text" id="customMood" class="custom-mood-input" placeholder="✏️ 或自行輸入心情（例如：充滿期待、有點疲倦）" oninput="handleCustomMoodInput()">
        </div>

        <button class="action-btn" onclick="goToStep(2)">下一步：寫感恩日記 ➡️</button>
      </div>

      <!-- 第二頁：三點感恩日記 -->
      <div id="page2" style="display: none;">
        <div class="three-things-title">🌸 今天想感謝或開心的 3 件事：</div>
        <div class="item-input-group">
          <div class="input-row">
            <span class="row-num">1.</span>
            <input type="text" id="entry1" placeholder="例如：早上吃到熱騰騰好吃的地瓜粥">
          </div>
          <div class="input-row">
            <span class="row-num">2.</span>
            <input type="text" id="entry2" placeholder="例如：老朋友打電話來互相關心問候">
          </div>
          <div class="input-row">
            <span class="row-num">3.</span>
            <input type="text" id="entry3" placeholder="例如：陽台的花開得很漂亮（可選填）">
          </div>
        </div>

        <div class="btn-row">
          <button class="action-btn secondary-btn" onclick="goToStep(1)">⬅️ 上一步</button>
          <button class="action-btn" id="submitBtn" onclick="submitJournal()">儲存日記 ✨</button>
        </div>
      </div>
    </section>

    <!-- 歷史日記列表 -->
    <div class="section-title">
      <span>📖 我的回憶手帳</span>
      <span id="entryCount" style="font-size: 14px; color: var(--primary-color);">載入中...</span>
    </div>

    <main class="journal-list" id="journalContainer">
      <div class="empty-state">正在翻開日記本...✨</div>
    </main>
  </div>

  <script>
    // 你的專屬 Google Apps Script 接收端
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-w6s13d9CPgLDqSFRnLExEFrNBfvz3A8i3HldMeKJCISzrirc0mclCnD4WereLPuf/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('uid') || "guest_user";

    // 專屬加密密鑰（使用每個長輩唯一的 userId 進行端對端 AES 加密）
    const ENCRYPTION_KEY = userId;

    let selectedWeather = "☀️ 晴天";
    let selectedMood = "😊 開心";

    function initDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
      const dayName = weekDays[now.getDay()];
      document.getElementById('displayDate').innerText = `📅 ${year} 年 ${month} 月 ${date} 日 (星期${dayName})`;
    }

    // 翻頁控制
    function goToStep(step) {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');
      const indicator = document.getElementById('stepIndicator');

      if (step === 2) {
        p1.style.display = 'none';
        p2.style.display = 'block';
        indicator.innerText = '第 2 / 2 步';
      } else {
        p2.style.display = 'none';
        p1.style.display = 'block';
        indicator.innerText = '第 1 / 2 步';
      }
    }

    // 選擇天氣
    function selectWeather(val) {
      selectedWeather = val;
      const pills = document.getElementById('weatherGroup').getElementsByClassName('select-pill');
      for (let p of pills) {
        p.classList.toggle('active', p.innerText === val);
      }
    }

    // 選擇預設心情
    function selectPresetMood(val) {
      selectedMood = val;
      document.getElementById('customMood').value = '';
      const pills = document.getElementById('moodGroup').getElementsByClassName('select-pill');
      for (let p of pills) {
        p.classList.toggle('active', p.innerText === val);
      }
    }

    // 自填心情處理
    function handleCustomMoodInput() {
      const customVal = document.getElementById('customMood').value.trim();
      const pills = document.getElementById('moodGroup').getElementsByClassName('select-pill');
      
      if (customVal) {
        for (let p of pills) p.classList.remove('active');
        selectedMood = `✨ ${customVal}`;
      } else {
        pills[0].classList.add('active');
        selectedMood = pills[0].innerText;
      }
    }

    // 讀取歷史日記（解密並呈現）
    async function loadJournals() {
      const container = document.getElementById('journalContainer');
      const countLabel = document.getElementById('entryCount');
      
      try {
        const res = await fetch(`${SCRIPT_URL}?uid=${encodeURIComponent(userId)}`);
        const data = await res.json();
        
        if (!data || data.length === 0) {
          container.innerHTML = `<div class="empty-state">還沒有日記紀錄喔！在上方寫下第一篇吧 🌸</div>`;
          countLabel.innerText = "0 篇";
          return;
        }

        countLabel.innerText = `共 ${data.length} 篇`;
        container.innerHTML = data.map(item => {
          let decryptedContent = "";
          try {
            // 在長輩手機端解密還原
            const bytes = CryptoJS.AES.decrypt(item.content, ENCRYPTION_KEY);
            decryptedContent = bytes.toString(CryptoJS.enc.Utf8);
            if (!decryptedContent) decryptedContent = item.content;
          } catch (e) {
            decryptedContent = item.content;
          }

          return `
            <article class="journal-card">
              <div class="card-meta">
                <span>📅 ${item.date}</span>
              </div>
              <div class="card-items">
                ${decryptedContent.split('\n').map(line => `<li>${line}</li>`).join('')}
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">目前無法載入日記，請確認網路連線。</div>`;
      }
    }

    // 送出三點日記（端對端加密）
    async function submitJournal() {
      const e1 = document.getElementById('entry1').value.trim();
      const e2 = document.getElementById('entry2').value.trim();
      const e3 = document.getElementById('entry3').value.trim();
      const btn = document.getElementById('submitBtn');

      if (!e1 && !e2 && !e3) {
        alert("請至少在第 1 點寫下一件感恩的小事喔！🌸");
        return;
      }

      let formattedContent = `【天氣】${selectedWeather} ｜ 【心情】${selectedMood}\n`;
      let count = 1;
      if (e1) { formattedContent += `${count}. ${e1}\n`; count++; }
      if (e2) { formattedContent += `${count}. ${e2}\n`; count++; }
      if (e3) { formattedContent += `${count}. ${e3}\n`; count++; }

      // 🔐 在手機端進行端對端 AES 加密
      const encryptedContent = CryptoJS.AES.encrypt(formattedContent.trim(), ENCRYPTION_KEY).toString();

      btn.disabled = true;
      btn.innerText = "保密儲存中...✨";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            uid: userId,
            content: encryptedContent // 傳送至雲端的是加密後的亂碼
          })
        });

        alert("今天的感恩手帳已為您加密珍藏囉！🌸✨");
        document.getElementById('entry1').value = "";
        document.getElementById('entry2').value = "";
        document.getElementById('entry3').value = "";
        goToStep(1);
        loadJournals();
      } catch (err) {
        console.error(err);
        alert("已為您儲存！");
        goToStep(1);
        loadJournals();
      } finally {
        btn.disabled = false;
        btn.innerText = "儲存日記 ✨";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDate();
      loadJournals();
    });
  </script>
</body>
</html>
